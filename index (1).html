    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script>
    //========= START: COMPLETE JAVASCRIPT LOGIC =========//

    // --- 1. FIREBASE & APP CONFIGURATION ---
    // <<< পরিবর্তিত ফায়ারবেস কনফিগারেশন >>>
    const firebaseConfig = {
      apiKey: "AIzaSyCrWhN-Zo4KUEWwbSOqpy4pHRB8Lr8M6kQ",
      authDomain: "earn-view-cf5b6.firebaseapp.com",
      databaseURL: "https://earn-view-cf5b6-default-rtdb.firebaseio.com",
      projectId: "earn-view-cf5b6",
      storageBucket: "earn-view-cf5b6.firebasestorage.app",
      messagingSenderId: "560272624342",
      appId: "1:560272624342:web:2979905c1b873429555777",
      measurementId: "G-8SXP0YWWMW"
    };

    let appSettings = {
        appName: "FREE USDT",
        pointsPerAd: 50,
        minWithdrawPoints: 10000,
        referralBonus: 500, 
        telegramBotUsername: "YOUR_BOT_USERNAME_HERE",
        developerTelegramLink: "https://t.me/Hason_of_CEO",
        withdrawalMethods: ["Bkash", "Nagad"],
        bonusChannels: [],
        ads: { rewardedZoneId: null, bannerScript: null, popunderScript: null, socialBarScript: null, nativeBannerScript: null },
        warningMessage: { text: "", link: "", interval: 99999999 }
    };

    let currentUser = null, userId = null, userIsGuest = true, adWatchedSuccessfully = false, adRewardPending = false;
    const loadingOverlay = document.getElementById('loading-overlay');
    const appContainer = document.querySelector('.app-container');
    const mainContent = document.getElementById('mainContent');
    const adModal = document.getElementById('adModal');

    // --- 2. INITIALIZATION SCRIPT ---
    document.addEventListener('DOMContentLoaded', () => {
        firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged(firebaseUser => {
            if (firebaseUser) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id.toString() : firebaseUser.uid;
                userIsGuest = !(tg.initDataUnsafe && tg.initDataUnsafe.user);
                loadAppSettingsAndUser(tg.initDataUnsafe || {});
            } else {
                firebase.auth().signInAnonymously().catch(error => handleAuthError("Firebase connection failed: " + error.message));
            }
        });
    });

    function handleAuthError(message) {
        loadingOverlay.innerHTML = `<p style="color:var(--error-color); padding: 20px; text-align:center;">${message}</p>`;
    }
    
    async function loadAppSettingsAndUser(tgData) {
        try {
            const settingsSnapshot = await firebase.database().ref('settings').once('value');
            if (settingsSnapshot.exists()) appSettings = { ...appSettings, ...settingsSnapshot.val() };
            await loadOrCreateUser(tgData);
        } catch (error) {
            handleAuthError("Error loading app data: " + error.message);
        }
    }

    async function loadOrCreateUser(tgData) {
        const userRef = firebase.database().ref('users/' + userId);
        const snapshot = await userRef.once('value');
        const tgUser = tgData.user;

        let isNewUser = !snapshot.exists();
        if (isNewUser) {
             const referralCode = `TOP${userId.toString().slice(-6)}`;
             currentUser = {
                id: userId,
                username: tgUser ? (tgUser.username || 'N/A') : 'guest',
                firstName: tgUser ? tgUser.first_name : 'Guest',
                lastName: tgUser ? (tgUser.last_name || '') : 'User',
                points: 0, totalAdsWatched: 0,
                joinedAt: new Date().toISOString(),
                claimedBonuses: [], status: 'active',
                referralCode: referralCode,
                referredBy: null,
                referralsCount: 0,
                referralBonusEarned: 0,
            };
            await userRef.set(currentUser);
            await firebase.database().ref(`referralCodes/${referralCode}`).set(userId);
        } else {
            currentUser = snapshot.val();
            if (!currentUser.referralCode) {
                currentUser.referralCode = `TOP${userId.toString().slice(-6)}`;
                await userRef.child('referralCode').set(currentUser.referralCode);
                await firebase.database().ref(`referralCodes/${currentUser.referralCode}`).set(userId);
            }
            if (currentUser.referralsCount === undefined) await userRef.child('referralsCount').set(0);
            if (currentUser.referralBonusEarned === undefined) await userRef.child('referralBonusEarned').set(0);
        }
        
        if (currentUser.status === 'blocked') {
            handleAuthError("Your account has been blocked by the administrator.");
            return;
        }
        
        if (isNewUser && tgData.start_param) {
            await processReferral(tgData.start_param, userId);
        }

        initializeApp(tgUser);
    }
    
    async function processReferral(referrerCode, newUserId) {
        const referrerIdSnapshot = await firebase.database().ref(`referralCodes/${referrerCode}`).once('value');
        if (!referrerIdSnapshot.exists()) {
            console.log("Referrer code not found:", referrerCode);
            return;
        }
        const referrerId = referrerIdSnapshot.val();
        if (referrerId === newUserId) {
            console.log("User cannot refer themself.");
            return;
        }
        
        const referrerRef = firebase.database().ref(`users/${referrerId}`);
        const bonusAmount = appSettings.referralBonus || 0;

        await referrerRef.transaction(referrerData => {
            if (referrerData) {
                referrerData.points = (referrerData.points || 0) + bonusAmount;
                referrerData.referralsCount = (referrerData.referralsCount || 0) + 1;
                referrerData.referralBonusEarned = (referrerData.referralBonusEarned || 0) + bonusAmount;
            }
            return referrerData;
        });

        await firebase.database().ref(`users/${newUserId}/referredBy`).set(referrerId);
    }

    function initializeApp(tgUser) {
        loadingOverlay.style.display = 'none';
        appContainer.style.display = 'flex';
        
        applyTheme(localStorage.getItem('topNetworkTheme') || 'light');
        injectAds();
        
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navigateTo(item.dataset.page);
            });
        });
        document.getElementById('adCloseBtn').addEventListener('click', closeAdModalAndReward);

        navigateTo('home');
        setupWarningMessage();
        updateUI(tgUser);
    }
    
    function injectScript(containerId, scriptHtml) {
        if (!scriptHtml) return;
        const container = document.getElementById(containerId);
        if (!container) return;
        
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = scriptHtml;
        const scriptTag = tempDiv.querySelector('script');
        if (!scriptTag) return;

        const newScript = document.createElement('script');
        for (let i = 0; i < scriptTag.attributes.length; i++) {
            const attr = scriptTag.attributes[i];
            newScript.setAttribute(attr.name, attr.value);
        }
        newScript.innerHTML = scriptTag.innerHTML;
        
        container.innerHTML = '';
        container.appendChild(newScript);
        container.style.display = 'flex';
    }

    function injectAds() {
        if (!appSettings.ads) return;
        if (appSettings.ads.rewardedZoneId) {
            const script = document.createElement('script');
            script.src = `//jagnaimsee.net/vignette.min.js?zone=${appSettings.ads.rewardedZoneId}`;
            script.dataset.zone = appSettings.ads.rewardedZoneId;
            script.dataset.sdk = `show_${appSettings.ads.rewardedZoneId}`;
            document.body.appendChild(script);
        }
        injectScript('ad-slot-banner-top', appSettings.ads.bannerScript);
        injectScript('ad-slot-banner-bottom', appSettings.ads.bannerScript);
        injectScript('ad-slot-native-banner', appSettings.ads.nativeBannerScript);
        
        if (appSettings.ads.popunderScript) injectScriptToBody(appSettings.ads.popunderScript);
        if (appSettings.ads.socialBarScript) injectScriptToBody(appSettings.ads.socialBarScript);
    }
    
    function injectScriptToBody(scriptHtml) {
        if (!scriptHtml) return;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = scriptHtml;
        const scriptTag = tempDiv.querySelector('script');
        if (!scriptTag) return;
        document.body.appendChild(scriptTag);
    }

    function updateUI(tgUser) {
        if (!currentUser) return;
        
        const profilePic = document.getElementById('profilePic');
        if (!userIsGuest && tgUser && tgUser.photo_url) {
            profilePic.src = tgUser.photo_url;
        } else {
            profilePic.src = 'https://i.ibb.co/sdc6JgCm/1000069673.jpg';
        }
        
        document.getElementById('profileNameDisplay').innerHTML = `${currentUser.firstName} ${currentUser.lastName} ${!userIsGuest ? '<i class="fas fa-check-circle verified-profile-icon" title="Verified Telegram User"></i>' : ''}`;
        document.getElementById('userPointsDisplay').innerHTML = `<i class="fas fa-star"></i> ${(currentUser.points || 0).toLocaleString()} Points`;
        document.getElementById('userAdStatsDisplay').textContent = `Total Ads Watched: ${currentUser.totalAdsWatched || 0}`;
        document.getElementById('developerFooterDynamicLink').href = appSettings.developerTelegramLink;

        const noticeArea = document.getElementById('dynamic-notice-area');
        if (appSettings.notice && appSettings.notice.active && appSettings.notice.text) {
            let noticeHTML = `<div class="task-card"><p>${appSettings.notice.text}</p>`;
            if (appSettings.notice.imageUrl) {
                noticeHTML += `<img src="${appSettings.notice.imageUrl}" style="width:100%; border-radius:8px; margin-top:10px;">`;
            }
            noticeHTML += `</div>`;
            noticeArea.innerHTML = noticeHTML;
            noticeArea.style.display = 'block';
        } else {
            noticeArea.style.display = 'none';
        }
    }

    function applyTheme(theme) {
        document.body.classList.toggle('dark-mode', theme === 'dark');
        document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        localStorage.setItem('topNetworkTheme', theme);
    }

    function toggleTheme() {
        applyTheme(document.body.classList.contains('dark-mode') ? 'light' : 'dark');
    }
    
    function navigateTo(page) {
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));
        const activeNavItem = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (activeNavItem) activeNavItem.classList.add('active');
        
        const pageRenderers = {
            'home': renderHomePage,
            'tasks': renderTasksPage,
            'bonus': renderBonusPage,
            'withdraw': renderWithdrawPage,
            'refer': renderReferralPage
        };
        
        if(pageRenderers[page]) {
            pageRenderers[page]();
        }
        
        updateUI(); 
    }

    function renderHomePage() {
        mainContent.innerHTML = `
            <div class="task-card">
                <h2><i class="fas fa-home"></i> Welcome, ${currentUser.firstName}!</h2>
                <p>You are part of ${appSettings.appName}. Explore tasks, claim bonuses, and refer friends to earn points.</p>                
                <p>Your current balance is: <strong><i class="fas fa-star"></i> ${(currentUser.points || 0).toLocaleString()} Points</strong></p>
            </div>
            <div class="task-card">
                <h2><i class="fas fa-bullhorn"></i> System Updates</h2>
                <p>We've launched our new referral program! Invite your friends and earn ${appSettings.referralBonus} points for each successful referral. Check the 'Refer' tab for your link.</p>
            </div>`;
    }

    function renderTasksPage() {
        const adEnabled = appSettings.ads && appSettings.ads.rewardedZoneId;
        mainContent.innerHTML = `
            <div class="task-card">
                <h2><i class="fas fa-play-circle"></i> Daily Ad Engagements</h2>
                <p>${adEnabled ? 'Watch rewarded ads to earn points. You can watch unlimited ads!' : 'Sorry, tasks are currently unavailable. Please check back later.'}</p>
                <button class="task-button" id="watchDailyAdBtn" ${!adEnabled ? 'disabled' : ''}>
                    <i class="fas fa-eye"></i> Watch Ad (${appSettings.pointsPerAd || 0} Points)
                </button>
            </div>`;
        if(adEnabled) {
            document.getElementById('watchDailyAdBtn').addEventListener('click', handleWatchDailyAd);
        }
    }
    
    function renderBonusPage() {
        const devChannel = { id: 'developer_channel', name: 'Developer Channel', link: appSettings.developerTelegramLink, reward: 100, icon: 'fas fa-user-secret' };
        let allChannels = [devChannel, ...(appSettings.bonusChannels || [])];
        let channelsHtml = allChannels.map(channel => {
           const isClaimed = currentUser.claimedBonuses && currentUser.claimedBonuses.includes(channel.id);
           return `
               <li class="channel-item">
                   <div class="channel-info">
                       <i class="${channel.icon}"></i>
                       <span class="channel-name">${channel.name}</span>
                   </div>
                   <a href="${channel.link}" target="_blank" class="channel-join-btn ${isClaimed ? 'visited' : ''}" data-channel-id="${channel.id}" data-reward="${channel.reward}" onclick="handleBonusLinkClick(event, this)"> 
                      ${isClaimed ? 'Claimed' : `Claim ${channel.reward} Points`}
                   </a>
               </li>`;
        }).join('');
        mainContent.innerHTML = `
            <div class="task-card">
                <h2><i class="fas fa-gift"></i> Community Bonus</h2>
                <p>Join our channels to unlock bonus points. Click to visit, then return here to claim your reward.</p>
                <ul class="channel-list">${channelsHtml}</ul>
            </div>`;
    }

    function renderReferralPage() {
        const referralLink = `https://t.me/${appSettings.telegramBotUsername}/${appSettings.appName.replace(/\s+/g, '')}?start=${currentUser.referralCode}`;
        mainContent.innerHTML = `
            <div class="task-card">
                <h2><i class="fas fa-user-plus"></i> Invite & Earn</h2>
                <p>Share your referral link with friends. When they join, you'll receive a bonus of <strong>${appSettings.referralBonus} points!</strong></p>
                <div class="referral-link-container">
                    <input type="text" id="referralLinkInput" value="${referralLink}" readonly>
                    <button class="copy-btn" id="copyReferralBtn"><i class="fas fa-copy"></i></button>
                </div>
                <button class="task-button" id="shareReferralBtn"><i class="fab fa-telegram-plane"></i> Share on Telegram</button>
                <div class="referral-stats">
                    <div class="stat-box">
                        <div class="stat-value">${currentUser.referralsCount || 0}</div>
                        <div class="stat-label">Users Referred</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value"><i class="fas fa-star" style="font-size:0.8em;"></i> ${(currentUser.referralBonusEarned || 0).toLocaleString()}</div>
                        <div class="stat-label">Bonus Earned</div>
                    </div>
                </div>
            </div>`;

        document.getElementById('copyReferralBtn').addEventListener('click', () => {
            const input = document.getElementById('referralLinkInput');
            input.select();
            document.execCommand('copy');
            alert('Referral link copied!');
        });
        document.getElementById('shareReferralBtn').addEventListener('click', () => {
             const text = `Join ${appSettings.appName} and earn points! Use my link to get started:`;
             const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}&text=${encodeURIComponent(text)}`;
             window.open(shareUrl, '_blank');
        });
    }
    
    function renderWithdrawPage() {
        let optionsHtml = (appSettings.withdrawalMethods || []).map(method => `<option value="${method}">${method}</option>`).join('');
        mainContent.innerHTML = `
            <div class="task-card">
                <h2><i class="fas fa-wallet"></i> Withdraw Points</h2>
                <p>Minimum withdrawal: ${(appSettings.minWithdrawPoints || 0).toLocaleString()} points.</p>
                <p>Your balance: <strong><i class="fas fa-star"></i> ${(currentUser.points || 0).toLocaleString()} Points</strong></p>
                <div style="margin-top: 20px;">
                    <input type="number" id="withdrawAmountInput" placeholder="Amount in points" class="withdraw-input">
                    <select id="withdrawMethodSelect" class="withdraw-select"><option value="">-- Select Method --</option>${optionsHtml}</select>
                    <input type="text" id="withdrawAccountInput" placeholder="Account Number / ID" class="withdraw-input">
                    <button class="task-button" id="submitWithdrawBtn" style="margin-top:10px;"><i class="fas fa-paper-plane"></i> Submit Request</button>
                    <p id="withdrawStatusMsg" style="text-align:center; margin-top:15px; font-size:0.9em; min-height: 18px;"></p>
                </div>
            </div>`;
        document.getElementById('submitWithdrawBtn').addEventListener('click', handleSubmitWithdrawal);
    }
    
    function handleWatchDailyAd() {
        adWatchedSuccessfully = false;
        adRewardPending = true;
        const adModalTitle = document.getElementById('adModalTitle');
        const adSpinner = document.getElementById('adSpinner');
        const adCloseBtn = document.getElementById('adCloseBtn');
        const adStatusMessage = document.getElementById('adStatusMessage');

        adModal.classList.add('show');
        adModalTitle.textContent = "Loading Rewarded Ad...";
        adSpinner.style.display = 'block';
        adCloseBtn.style.display = 'none';
        adStatusMessage.textContent = "Please wait for the ad to start...";
        
        const adFunctionName = `show_${appSettings.ads.rewardedZoneId}`;
        if (typeof window[adFunctionName] === 'function') {
             window[adFunctionName]().then(() => {
                if (adRewardPending) {
                    adModalTitle.textContent = "Ad Completed!";
                    adSpinner.style.display = 'none';
                    adStatusMessage.textContent = "You can now close this window to claim your reward.";
                    adCloseBtn.style.display = 'block';
                    adWatchedSuccessfully = true;
                }
            }).catch(() => { handleAdError("Ad failed to show or was closed early."); });
        } else { handleAdError(`Ad function not found. Please try again later.`); }
    }

    function handleAdError(errorMessage) {
        if(adRewardPending) {
            const adModalTitle = document.getElementById('adModalTitle');
            const adSpinner = document.getElementById('adSpinner');
            const adCloseBtn = document.getElementById('adCloseBtn');
            const adStatusMessage = document.getElementById('adStatusMessage');
            adSpinner.style.display = 'none';
            adStatusMessage.textContent = errorMessage + " (No points awarded)";
            adModalTitle.textContent = "Ad Error";
            adCloseBtn.textContent = "Close";
            adCloseBtn.style.display = 'block';
            adWatchedSuccessfully = false; 
        }
    }

    function closeAdModalAndReward() {
        adModal.classList.remove('show');
        if (adWatchedSuccessfully && adRewardPending) {
            const rewardAmount = appSettings.pointsPerAd || 0;
            const updates = {
                [`/users/${userId}/points`]: firebase.database.ServerValue.increment(rewardAmount),
                [`/users/${userId}/totalAdsWatched`]: firebase.database.ServerValue.increment(1)
            };
            firebase.database().ref().update(updates).then(() => {
                currentUser.points = (currentUser.points || 0) + rewardAmount;
                currentUser.totalAdsWatched = (currentUser.totalAdsWatched || 0) + 1;
                updateUI();
                alert(`Congratulations! +${rewardAmount} points have been added.`);
            }).catch(error => { alert("Failed to save points. Error: " + error.message); });
        }
        adRewardPending = false; 
        adWatchedSuccessfully = false;
    }

    function handleBonusLinkClick(event, buttonElement) {
        event.preventDefault();
        const channelId = buttonElement.dataset.channelId;
        const reward = parseInt(buttonElement.dataset.reward);

        if (currentUser.claimedBonuses && currentUser.claimedBonuses.includes(channelId)) return;
        
        window.open(buttonElement.href, '_blank');
        buttonElement.textContent = 'Verifying...';
        buttonElement.style.pointerEvents = 'none';

        setTimeout(() => {
            firebase.database().ref(`users/${userId}/claimedBonuses`).transaction(bonuses => {
                bonuses = bonuses || [];
                if (bonuses.includes(channelId)) return;
                bonuses.push(channelId);
                return bonuses;
            }).then(result => {
                if (result.committed) {
                    firebase.database().ref(`users/${userId}/points`).transaction(points => (points || 0) + reward)
                    .then(() => {
                        currentUser.points = (currentUser.points || 0) + reward;
                        currentUser.claimedBonuses = result.snapshot.val();
                        updateUI();
                        buttonElement.textContent = 'Claimed';
                        buttonElement.classList.add('visited');
                        alert(`${reward} bonus points claimed successfully!`);
                    });
                }
            });
        }, 5000); 
    }

    function handleSubmitWithdrawal() {
        const amount = parseInt(document.getElementById('withdrawAmountInput').value);
        const method = document.getElementById('withdrawMethodSelect').value;
        const account = document.getElementById('withdrawAccountInput').value.trim();
        const statusMsg = document.getElementById('withdrawStatusMsg');
        
        statusMsg.style.color = 'var(--error-color)'; 
        if (isNaN(amount) || amount <= 0) { statusMsg.textContent = "Please enter a valid amount."; return; }
        if (amount < appSettings.minWithdrawPoints) { statusMsg.textContent = `Minimum withdrawal is ${appSettings.minWithdrawPoints} points.`; return; }
        if (amount > (currentUser.points || 0)) { statusMsg.textContent = "You have insufficient points."; return; }
        if (!method) { statusMsg.textContent = "Please select a payment method."; return; }
        if (!account) { statusMsg.textContent = "Please enter your account details."; return; }

        const newPoints = (currentUser.points || 0) - amount;
        const withdrawalRequest = {
            userId: userId, username: currentUser.username, userName: `${currentUser.firstName} ${currentUser.lastName}`,
            points: amount, method: method, account: account, status: 'pending', requestedAt: firebase.database.ServerValue.TIMESTAMP
        };
        const newRequestKey = firebase.database().ref().child('withdrawals').push().key;
        const updates = {
            [`/users/${userId}/points`]: newPoints,
            [`/withdrawals/${newRequestKey}`]: withdrawalRequest
        };
        firebase.database().ref().update(updates).then(() => {
            currentUser.points = newPoints;
            updateUI();
            statusMsg.textContent = "Withdrawal request submitted successfully!";
            statusMsg.style.color = 'var(--success-color)';
            document.getElementById('withdrawAmountInput').value = '';
            document.getElementById('withdrawAccountInput').value = '';
        }).catch(error => { statusMsg.textContent = "Error submitting request: " + error.message; });
    }

    function setupWarningMessage() {
        const popup = document.getElementById('warningPopup');
        const config = appSettings.warningMessage;
        if (!popup || !config || !config.text || !config.link) return;
        popup.innerText = config.text;
        popup.addEventListener('click', () => { window.open(config.link, '_blank'); popup.classList.remove('show'); });
        setInterval(() => { popup.classList.add('show'); setTimeout(() => popup.classList.remove('show'), 4000); }, config.interval);
    }
    </script>
